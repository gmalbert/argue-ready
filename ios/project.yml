name: ArgueReady
options:
  bundleIdPrefix: com.argueready
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: MUSJ464BDS

targets:
  ArgueReady:
    type: application
    platform: iOS
    sources:
      - path: ArgueReady
        excludes:
          - Info.plist
      - path: SharedCore
      - path: WatchShared/WatchConnectivityBridge.swift
      - path: WatchShared/WatchSessionSnapshot.swift
    dependencies:
      - target: ArgueReadyWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argueready.app
        INFOPLIST_FILE: ArgueReady/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
    preBuildScripts:
      - name: Check ArgueReady use-notice regression
        script: /usr/bin/python3 "$SRCROOT/scripts/check_argueready_use_notice.py" "$SRCROOT"

  ArgueReadyWatch:
    type: application
    platform: watchOS
    sources:
      - path: ArgueReadyWatch
        excludes:
          - Info.plist
      - path: WatchShared/WatchRootView.swift
      - path: WatchShared/WatchConnectivityBridge.swift
      - path: WatchShared/WatchSessionSnapshot.swift
      - path: SharedCore/Models.swift
      - path: ArgueReady/LegalModels.swift
      - path: ArgueReady/LegalWatchSessionSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argueready.app.watchkitapp
        INFOPLIST_FILE: ArgueReadyWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
